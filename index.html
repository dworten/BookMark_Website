<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light theme (default) ── */
    :root {
      --bg-page:        #f0f2f5;
      --bg-card:        #ffffff;
      --bg-input:       #fafafa;
      --bg-input-focus: #ffffff;
      --bg-accent:      #eef2ff;
      --bg-accent-hover:#e0e8ff;
      --bg-count-pill:  #f0f2f5;
      --bg-cat-hover:   #f5f7ff;

      --text-primary:   #1a1a2e;
      --text-heading:   #16213e;
      --text-sub:       #444444;
      --text-label:     #555555;
      --text-muted:     #888888;
      --text-faint:     #aaaaaa;
      --text-link:      #4f8ef7;
      --text-accent:    #4f8ef7;

      --border:         #dde1e9;
      --border-focus:   #4f8ef7;

      --shadow-card:    0 2px 12px rgba(0,0,0,0.08);
      --shadow-item:    0 1px 6px rgba(0,0,0,0.07);
      --shadow-cat:     0 1px 4px rgba(0,0,0,0.06);
      --shadow-modal:   0 8px 32px rgba(0,0,0,0.18);
      --overlay-bg:     rgba(0,0,0,0.35);

      --btn-del:        #cccccc;
      --btn-del-hover:  #ee5555;
      --btn-edit:       #cccccc;
      --btn-edit-hover: #4f8ef7;
    }

    /* ── Dark theme ── */
    body.dark {
      --bg-page:        #0f1117;
      --bg-card:        #1e2130;
      --bg-input:       #161927;
      --bg-input-focus: #1e2130;
      --bg-accent:      #1e2a4a;
      --bg-accent-hover:#253660;
      --bg-count-pill:  #2a3050;
      --bg-cat-hover:   #253050;

      --text-primary:   #e2e8f0;
      --text-heading:   #f1f5f9;
      --text-sub:       #94a3b8;
      --text-label:     #94a3b8;
      --text-muted:     #94a3b8;
      --text-faint:     #64748b;
      --text-link:      #7ab3f9;
      --text-accent:    #7ab3f9;

      --border:         #2e3548;
      --border-focus:   #4f8ef7;

      --shadow-card:    0 2px 12px rgba(0,0,0,0.4);
      --shadow-item:    0 1px 6px rgba(0,0,0,0.35);
      --shadow-cat:     0 1px 4px rgba(0,0,0,0.3);
      --shadow-modal:   0 8px 32px rgba(0,0,0,0.6);
      --overlay-bg:     rgba(0,0,0,0.6);

      --btn-del:        #4a5568;
      --btn-del-hover:  #fc8181;
      --btn-edit:       #4a5568;
      --btn-edit-hover: #7ab3f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
      transition: background 0.25s, color 0.25s;
    }

    /* ── Theme toggle button ── */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 200;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      box-shadow: var(--shadow-item);
      transition: background 0.25s, border-color 0.25s, color 0.25s;
    }

    .theme-toggle:hover { opacity: 0.85; }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 2rem;
      color: var(--text-heading);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Form card */
    .card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow-card);
      padding: 1.75rem;
      margin-bottom: 2rem;
      transition: background 0.25s;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-grid {
      display: grid;
      gap: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: var(--text-label);
    }

    input, select {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-primary);
      transition: border-color 0.2s, background 0.25s;
      background: var(--bg-input);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--border-focus);
      background: var(--bg-input-focus);
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    button {
      padding: 0.65rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: #4f8ef7;
      color: #fff;
      flex: 1;
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary {
      background: var(--bg-accent);
      color: var(--text-accent);
    }

    .btn-secondary:hover { background: var(--bg-accent-hover); }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-bar input {
      flex: 1;
      min-width: 160px;
    }

    .filter-bar select { width: auto; }

    /* View toggle */
    .view-toggle {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .view-toggle button {
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      background: var(--bg-accent);
      color: var(--text-accent);
      transition: background 0.15s, color 0.15s;
    }

    .view-toggle button.active {
      background: #4f8ef7;
      color: #fff;
    }

    /* Category group */
    .category-group { margin-bottom: 1.25rem; }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.9rem;
      background: var(--bg-card);
      border-radius: 10px;
      box-shadow: var(--shadow-cat);
      cursor: pointer;
      user-select: none;
      margin-bottom: 0.6rem;
      transition: background 0.15s;
    }

    .category-header:hover { background: var(--bg-cat-hover); }

    .category-header-icon { font-size: 1.1rem; }

    .category-header-name {
      font-weight: 700;
      font-size: 0.95rem;
      flex: 1;
    }

    .category-header-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-count-pill);
      padding: 0.1rem 0.5rem;
      border-radius: 99px;
    }

    .category-chevron {
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s;
    }

    .category-group.collapsed .category-chevron { transform: rotate(-90deg); }
    .category-group.collapsed .category-items { display: none; }

    .category-items {
      display: grid;
      gap: 0.6rem;
      padding-left: 0.5rem;
    }

    /* Bookmark list (flat view) */
    #bookmark-list {
      display: grid;
      gap: 0.85rem;
    }

    .bookmark-item {
      background: var(--bg-card);
      border-radius: 10px;
      box-shadow: var(--shadow-item);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: background 0.25s;
    }

    .bookmark-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .bookmark-body { flex: 1; min-width: 0; }

    .bookmark-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-url {
      font-size: 0.8rem;
      color: var(--text-link);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
    }

    .bookmark-url:hover { text-decoration: underline; }

    .bookmark-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 99px;
      background: var(--bg-accent);
      color: var(--text-accent);
    }

    .bookmark-date {
      font-size: 0.72rem;
      color: var(--text-faint);
    }

    .btn-actions {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .btn-delete, .btn-edit {
      background: none;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      transition: color 0.15s;
    }

    .btn-delete { color: var(--btn-del); }
    .btn-delete:hover { color: var(--btn-del-hover); }

    .btn-edit { color: var(--btn-edit); }
    .btn-edit:hover { color: var(--btn-edit-hover); }

    /* Edit modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow-modal);
      padding: 1.75rem;
      width: min(480px, 92vw);
      transition: background 0.25s;
    }

    .modal h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .empty-state {
      text-align: center;
      color: var(--text-faint);
      padding: 2.5rem 1rem;
      font-size: 0.95rem;
    }

    .count-label {
      font-size: 0.82rem;
      color: var(--text-faint);
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">&#9790; Dark</button>

<div class="container">
  <h1>&#128278; Bookmark Manager</h1>

  <!-- Add bookmark form -->
  <div class="card">
    <h2>Add Bookmark</h2>
    <form id="bookmark-form" class="form-grid">
      <div>
        <label for="url">URL</label>
        <input type="url" id="url" placeholder="https://example.com" required />
      </div>
      <div>
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Page title" required />
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Design">Design</option>
          <option value="Development">Development</option>
          <option value="News">News</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Reference">Reference</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn-primary">Save Bookmark</button>
        <button type="button" class="btn-secondary" id="clear-btn">Clear</button>
      </div>
    </form>
  </div>

  <!-- Filter / search bar -->
  <div class="filter-bar">
    <input type="search" id="search" placeholder="Search bookmarks..." />
    <select id="filter-category">
      <option value="">All Categories</option>
    </select>
    <div class="view-toggle">
      <button id="view-flat" class="active" title="Flat list">&#9776; List</button>
      <button id="view-grouped" title="Group by category">&#9783; Grouped</button>
    </div>
  </div>

  <div class="count-label" id="count-label"></div>

  <!-- Bookmark list -->
  <div id="bookmark-list"></div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>Edit Bookmark</h2>
    <form id="edit-form" class="form-grid">
      <input type="hidden" id="edit-id" />
      <div>
        <label for="edit-url">URL</label>
        <input type="url" id="edit-url" placeholder="https://example.com" required />
      </div>
      <div>
        <label for="edit-title">Title</label>
        <input type="text" id="edit-title" placeholder="Page title" required />
      </div>
      <div>
        <label for="edit-category">Category</label>
        <select id="edit-category">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Design">Design</option>
          <option value="Development">Development</option>
          <option value="News">News</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Reference">Reference</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-secondary" id="edit-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  const STORAGE_KEY = 'bookmarks_v1';

  const categoryIcons = {
    Work: '💼', Design: '🎨', Development: '💻', News: '📰',
    Entertainment: '🎬', Reference: '📚', Shopping: '🛒', Other: '🔗', General: '🌐',
  };

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function save(bookmarks) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  let currentView = 'flat';
  const collapsedCategories = new Set();

  function bookmarkCard(b, showBadge = true) {
    return `
      <div class="bookmark-item" data-id="${b.id}">
        <div class="bookmark-icon">${categoryIcons[b.category] || '🔗'}</div>
        <div class="bookmark-body">
          <div class="bookmark-title" title="${escHtml(b.title)}">${escHtml(b.title)}</div>
          <a class="bookmark-url" href="${escHtml(b.url)}" target="_blank" rel="noopener noreferrer">${escHtml(b.url)}</a>
          <div class="bookmark-meta">
            ${showBadge ? `<span class="badge">${escHtml(b.category)}</span>` : ''}
            <span class="bookmark-date">${formatDate(b.createdAt)}</span>
          </div>
        </div>
        <div class="btn-actions">
          <button class="btn-edit" data-id="${b.id}" title="Edit">&#x270E;</button>
          <button class="btn-delete" data-id="${b.id}" title="Delete">&#x2715;</button>
        </div>
      </div>`;
  }

  function render(bookmarks) {
    const list = document.getElementById('bookmark-list');
    const countLabel = document.getElementById('count-label');

    if (!bookmarks.length) {
      list.innerHTML = '<div class="empty-state">No bookmarks yet. Add one above!</div>';
      countLabel.textContent = '';
      return;
    }

    countLabel.textContent = `${bookmarks.length} bookmark${bookmarks.length !== 1 ? 's' : ''}`;

    if (currentView === 'flat') {
      list.innerHTML = bookmarks.map(b => bookmarkCard(b, true)).join('');
      return;
    }

    // Grouped view
    const groups = {};
    bookmarks.forEach(b => {
      if (!groups[b.category]) groups[b.category] = [];
      groups[b.category].push(b);
    });

    list.innerHTML = Object.keys(groups).sort().map(cat => {
      const items = groups[cat];
      const collapsed = collapsedCategories.has(cat) ? 'collapsed' : '';
      return `
        <div class="category-group ${collapsed}" data-category="${escHtml(cat)}">
          <div class="category-header" data-toggle="${escHtml(cat)}">
            <span class="category-header-icon">${categoryIcons[cat] || '🔗'}</span>
            <span class="category-header-name">${escHtml(cat)}</span>
            <span class="category-header-count">${items.length}</span>
            <span class="category-chevron">&#9660;</span>
          </div>
          <div class="category-items">
            ${items.map(b => bookmarkCard(b, false)).join('')}
          </div>
        </div>`;
    }).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function updateCategoryFilter(bookmarks) {
    const sel = document.getElementById('filter-category');
    const current = sel.value;
    const categories = [...new Set(bookmarks.map(b => b.category))].sort();
    sel.innerHTML = '<option value="">All Categories</option>' +
      categories.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
    sel.value = categories.includes(current) ? current : '';
  }

  function getFiltered() {
    const bookmarks = load();
    const query = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('filter-category').value;
    return bookmarks.filter(b =>
      (!query || b.title.toLowerCase().includes(query) || b.url.toLowerCase().includes(query)) &&
      (!cat || b.category === cat)
    );
  }

  function refresh() {
    updateCategoryFilter(load());
    render(getFiltered());
  }

  // Form submit
  document.getElementById('bookmark-form').addEventListener('submit', e => {
    e.preventDefault();
    const bookmarks = load();
    bookmarks.unshift({
      id: Date.now().toString(),
      url: document.getElementById('url').value.trim(),
      title: document.getElementById('title').value.trim(),
      category: document.getElementById('category').value,
      createdAt: new Date().toISOString(),
    });
    save(bookmarks);
    e.target.reset();
    refresh();
  });

  // Clear button
  document.getElementById('clear-btn').addEventListener('click', () => {
    document.getElementById('bookmark-form').reset();
  });

  // Delete
  document.getElementById('bookmark-list').addEventListener('click', e => {
    const btn = e.target.closest('.btn-delete');
    if (!btn) return;
    const id = btn.dataset.id;
    save(load().filter(b => b.id !== id));
    refresh();
  });

  // Edit — open modal
  document.getElementById('bookmark-list').addEventListener('click', e => {
    const btn = e.target.closest('.btn-edit');
    if (!btn) return;
    const id = btn.dataset.id;
    const bookmark = load().find(b => b.id === id);
    if (!bookmark) return;
    document.getElementById('edit-id').value = bookmark.id;
    document.getElementById('edit-url').value = bookmark.url;
    document.getElementById('edit-title').value = bookmark.title;
    document.getElementById('edit-category').value = bookmark.category;
    document.getElementById('edit-modal').classList.add('open');
    document.getElementById('edit-url').focus();
  });

  // Edit — save changes
  document.getElementById('edit-form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('edit-id').value;
    const bookmarks = load().map(b => b.id !== id ? b : {
      ...b,
      url: document.getElementById('edit-url').value.trim(),
      title: document.getElementById('edit-title').value.trim(),
      category: document.getElementById('edit-category').value,
    });
    save(bookmarks);
    document.getElementById('edit-modal').classList.remove('open');
    refresh();
  });

  // Edit — close modal
  function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('open');
  }
  document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeEditModal();
  });

  // Search & filter
  document.getElementById('search').addEventListener('input', () => render(getFiltered()));
  document.getElementById('filter-category').addEventListener('change', () => render(getFiltered()));

  // View toggle
  document.getElementById('view-flat').addEventListener('click', () => {
    currentView = 'flat';
    document.getElementById('view-flat').classList.add('active');
    document.getElementById('view-grouped').classList.remove('active');
    render(getFiltered());
  });

  document.getElementById('view-grouped').addEventListener('click', () => {
    currentView = 'grouped';
    document.getElementById('view-grouped').classList.add('active');
    document.getElementById('view-flat').classList.remove('active');
    render(getFiltered());
  });

  // Collapse/expand category groups
  document.getElementById('bookmark-list').addEventListener('click', e => {
    const header = e.target.closest('[data-toggle]');
    if (!header) return;
    const cat = header.dataset.toggle;
    const group = header.closest('.category-group');
    if (collapsedCategories.has(cat)) {
      collapsedCategories.delete(cat);
      group.classList.remove('collapsed');
    } else {
      collapsedCategories.add(cat);
      group.classList.add('collapsed');
    }
  });

  // ── Theme toggle ──
  const themeBtn = document.getElementById('theme-toggle');

  function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeBtn.innerHTML = dark ? '&#9728; Light' : '&#9790; Dark';
  }

  const savedDark = localStorage.getItem('theme') === 'dark';
  applyTheme(savedDark);

  themeBtn.addEventListener('click', () => {
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    applyTheme(!isDark);
  });

  // Initial render
  refresh();
</script>
</body>
</html>
